services:
  web:
    build: .
    command: ["sh", "-c", "rm -f /usr/local/tomcat/webapps/ROOT.war && catalina.sh run"]
    ports:
      - "8080:8080"
    volumes:
      - ./Project/src/main/webapp:/usr/local/tomcat/webapps/ROOT
      - ./Project/target/classes:/usr/local/tomcat/webapps/ROOT/WEB-INF/classes
      - ./Project/target/tele-expertise/WEB-INF/lib:/usr/local/tomcat/webapps/ROOT/WEB-INF/lib
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: E_Diagnostic_serv
      DB_USER: postgres
      DB_PASSWORD: 2003

  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: E_Diagnostic_serv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2003
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d E_Diagnostic_serv"]
      interval: 5s
      timeout: 5s
      retries: 10